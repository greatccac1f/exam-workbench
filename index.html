<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备考工作台 · 五科记录 / 统计 / 练题 / 复习</title>
<!-- SECTION: styles -->
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#182130; --ink2:#5b6779; --ink3:#8a95a6;
  --line:#e2e7ef; --line2:#eef1f6; --accent:#2f5fe3; --accent2:#1d45b8;
  --accent-soft:#eaf0ff; --ok:#12805c; --ok-soft:#e4f6ee; --warn:#a1560a; --warn-soft:#fdf1e2;
  --bad:#bf2727; --bad-soft:#fdeaea; --gray-soft:#f0f2f6; --radius:12px;
  --shadow:0 1px 2px rgba(24,33,48,.05), 0 6px 20px rgba(24,33,48,.05);
  --shadow-lg:0 12px 40px rgba(24,33,48,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Roboto,sans-serif;
  padding-bottom:96px; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:650}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hidden{display:none!important}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1260px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--accent),#5b8cff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand h1{font-size:16px}
.brand p{margin:0;font-size:11.5px;color:var(--ink3)}
.searchbox{position:relative;flex:1 1 240px;max-width:320px}
.searchbox input{width:100%;height:34px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:9px;background:var(--gray-soft)}
.searchbox input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:#fff}
.searchbox .ico{position:absolute;left:10px;top:8px;color:var(--ink3)}
.suggest{position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);max-height:290px;overflow:auto;z-index:60}
.suggest button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line2)}
.suggest button:hover{background:var(--accent-soft)}
.suggest .tag{font-size:11px;color:var(--ink3)}
.countdowns{display:flex;gap:8px;flex-wrap:wrap}
.cd{border:1px solid var(--line);border-radius:9px;padding:4px 10px;background:#fff;min-width:82px}
.cd b{display:block;font-size:15px;line-height:1.2}
.cd span{font-size:11px;color:var(--ink3)}
.cd.hot{border-color:#f3c9a0;background:var(--warn-soft)}
.cd.hot b{color:var(--warn)}
.cd.na b{color:var(--ink3)}
.tabs{max-width:1260px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px;font-size:13.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{background:var(--gray-soft);color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:650;background:#fff}
.wrap{max-width:1260px;margin:0 auto;padding:20px}
.subtabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;font-size:13px;color:var(--ink2);cursor:pointer}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.subtabs button .cnt{opacity:.7;font-size:11.5px;margin-left:4px}

/* ---------- cards & grids ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{font-size:14.5px;margin-bottom:4px}
.card .sub{font-size:12px;color:var(--ink3);margin:0 0 12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:1fr}}
@media (max-width:660px){.g4,.g3,.g2,.g-2-1{grid-template-columns:1fr}.wrap{padding:14px}.topbar-in{padding:10px 14px}.tabs{padding:0 14px}}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:26px;line-height:1.15}
.kpi .lb{font-size:12px;color:var(--ink3)}
.kpi .fo{font-size:11.5px;color:var(--ink2)}
.kpi .fo.up{color:var(--ok)}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--gray-soft);color:var(--ink2);border:1px solid var(--line2)}
.chip.accent{background:var(--accent-soft);color:var(--accent2);border-color:#d5e2ff}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:#c8ebdb}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:#f3d9b6}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:#f6cfcf}
.chip.seed{background:#f0edff;color:#5b45c8;border-color:#ded6ff;cursor:default}
.chip.clickable{cursor:pointer}
.chip.clickable:hover{border-color:var(--accent);color:var(--accent)}
.rowchips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.ghost{border-color:transparent;background:var(--gray-soft);color:var(--ink2)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
.field textarea{resize:vertical;min-height:70px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field .hint{font-size:11.5px;color:var(--ink3)}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.form-grid.wide{grid-template-columns:1fr}
hr.sep{border:0;border-top:1px solid var(--line2);margin:14px 0}

/* ---------- bars & charts ---------- */
.hbar{display:grid;grid-template-columns:74px 1fr 46px;gap:8px;align-items:center;font-size:12px;margin-bottom:7px}
.hbar .t{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:8px;border-radius:5px;background:var(--line2);overflow:hidden}
.hbar .fl{height:100%;border-radius:5px;background:var(--accent)}
.hbar .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.vbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.vbars .bar{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#5b8cff,var(--accent))}
.vbars .bar.zero{background:var(--line2)}
.vbars .cap{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.vbars .val{font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.donut{position:relative;width:118px;height:118px;flex:0 0 auto}
.donut svg{transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .ctr b{font-size:21px;line-height:1}
.donut .ctr span{font-size:11px;color:var(--ink3)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px}
.legend .r{display:flex;justify-content:space-between;gap:12px}
.progress{height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:5px}
.stack{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--line2)}
.stack i{height:100%}
.meter-row{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin-bottom:9px;font-size:12.5px}
.meter-row .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hgrid .hh{font-size:11.5px;color:var(--ink3);text-align:center;font-weight:600}
.hgrid .hp{aspect-ratio:1/1}
.hgrid .hd{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .13s;padding:0}
.hgrid .hd:hover{border-color:var(--accent)}
.hgrid .hd .dn{font-size:13px;font-weight:650;color:var(--ink2)}
.hgrid .hd .dc{font-size:11px;line-height:1;color:var(--accent);height:12px}
.hgrid .hd.on{background:var(--ok-soft);border-color:var(--accent)}
.hgrid .hd.on .dn{color:var(--accent2)}
.hgrid .hd.today{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:900px){.weekgrid{display:flex;overflow-x:auto;padding-bottom:6px;gap:8px}.weekgrid>.card{min-width:150px;flex:0 0 auto}}

/* ---------- lists / tables ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.item:hover{border-color:#cfd9ea}
.item .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.item .hd .ttl{font-weight:600;flex:1;min-width:120px}
.item .meta{font-size:11.5px;color:var(--ink3)}
.item .bd{font-size:13px;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.item .ft{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.op{text-align:right;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:4px}
.kp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:9px}
.kp-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:7px}
.kp-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.kp-card .nm{font-weight:600;font-size:13px;flex:1}
.kp-card .sc{font-size:12px;color:var(--ink3)}
.kp-card .sec{font-size:11px;color:var(--ink3)}
.st0{background:var(--gray-soft);color:var(--ink2);border-color:var(--line)}
.st1{background:var(--warn-soft);color:var(--warn);border-color:#f3d9b6}
.st2{background:var(--ok-soft);color:var(--ok);border-color:#c8ebdb}
.st3{background:var(--bad-soft);color:var(--bad);border-color:#f6cfcf}

/* ---------- practice ---------- */
.qcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px}
.qcard .stem{font-size:14.5px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:7px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--accent);background:#fbfcff}
.opt .k{font-weight:650;color:var(--ink2);flex:0 0 auto}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.65}
.verdict{border-radius:10px;padding:11px 13px;font-size:13px;margin-top:12px;white-space:pre-wrap}
.verdict.ok{background:var(--ok-soft);color:#0d5f45}
.verdict.bad{background:var(--bad-soft);color:#8f1d1d}
.verdict.info{background:var(--accent-soft);color:var(--accent2)}
.verdict b{display:block;margin-bottom:3px}

/* ---------- dropzone ---------- */
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:#fff;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;margin-bottom:4px}
.drop p{margin:0;font-size:12px;color:var(--ink3)}
.report{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;background:var(--gray-soft);max-height:190px;overflow:auto}
.report .f{color:var(--bad)}
.report .s{color:var(--ok)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(18,26,38,.42);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:86vh;overflow:auto;padding:18px}
.modal h3{font-size:15.5px;margin-bottom:10px}
.modal .ft{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}

/* ---------- toast ---------- */
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1b2430;color:#fff;border-radius:9px;padding:8px 15px;font-size:13px;box-shadow:var(--shadow-lg);animation:tin .2s}
.toast.ok{background:#0f6c4d}.toast.bad{background:#a41f1f}
@keyframes tin{from{opacity:0;transform:translateY(-7px)}}

/* ---------- AI dock ---------- */
.dock{position:fixed;left:18px;bottom:18px;z-index:70}
.dock-btn{width:52px;height:52px;border-radius:16px;border:0;background:linear-gradient(140deg,var(--accent),#6f9bff);color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-lg);line-height:1.15}
.dock-btn:hover{transform:translateY(-1px)}
.panel{position:absolute;left:0;bottom:62px;width:352px;height:min(540px,72vh);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.panel .ph{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel .ph b{font-size:13.5px}
.panel .ph .sp{margin-left:auto}
.panel .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fbfcfe}
.msg{max-width:88%;padding:9px 11px;border-radius:11px;font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.msg.sys{align-self:center;background:var(--warn-soft);color:var(--warn);font-size:11.5px;max-width:96%}
.msg .who{display:block;font-size:10.5px;opacity:.75;margin-bottom:3px}
.msg .act{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.panel .pcomposer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.panel textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:58px;resize:vertical;font:inherit;line-height:1.55}
.panel textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.panel .prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.panel .prow .sp{margin-left:auto}
.ctxbox{font-size:11.5px;color:var(--ink2);background:var(--accent-soft);border:1px solid #d5e2ff;border-radius:8px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start}
.ctxbox .x{margin-left:auto;cursor:pointer;color:var(--ink3)}
.warnbox{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border:1px solid #f3d9b6;border-radius:8px;padding:7px 9px}
@media (max-width:660px){.dock{left:12px;bottom:12px}.panel{width:calc(100vw - 24px);height:62vh}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<!-- SECTION: shell -->
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark">备</div>
      <div>
        <h1>备考工作台</h1>
        <p>考研政治 · 英语一 · 数学二 · 地科 880 · 六级/雅思 · 健身 · 自律打卡</p>
      </div>
    </div>
    <div class="searchbox">
      <span class="ico" aria-hidden="true">⌕</span>
      <input id="gsearch" type="search" placeholder="搜索错题 / 题目 / 文献 / 知识点" autocomplete="off" aria-label="全局搜索">
      <div id="gsuggest" class="suggest hidden"></div>
    </div>
    <div class="countdowns" id="countdowns"></div>
  </div>
  <nav class="tabs" id="maintabs" aria-label="主导航"></nav>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<!-- SECTION: ai dock -->
<div class="dock" id="dock">
  <div class="panel hidden" id="aipanel" role="dialog" aria-label="千问提问窗口">
    <div class="ph">
      <b>千问 · 提问窗口</b>
      <span class="chip" id="aimodelchip">未配置</span>
      <button class="btn small ghost sp" id="aiclr">清空</button>
      <button class="btn small ghost" id="aiclose" aria-label="关闭">✕</button>
    </div>
    <div class="msgs" id="aimsgs"></div>
    <div class="pcomposer">
      <div id="aictx"></div>
      <textarea id="aiinput" placeholder="把你的疑问写在这里，例如：这道题的 B 选项为什么不构成偷换概念？"></textarea>
      <div class="prow">
        <button class="btn small" id="aiattach">带入当前题目</button>
        <button class="btn small" id="aitpl">常用追问</button>
        <span class="sp"></span>
        <button class="btn primary small" id="aisend">发送提问</button>
      </div>
    </div>
  </div>
  <button class="dock-btn" id="dockbtn" aria-label="打开千问提问窗口" onclick="if(window.__dockBound)return;var q=document.getElementById('aipanel');if(q.classList.contains('hidden')){q.classList.remove('hidden');var i=document.getElementById('aiinput');if(i)setTimeout(function(){i.focus();},60);}else{q.classList.add('hidden');}">千问<br>AI</button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalroot"></div>

<script>
/* SECTION: seed —— 五科知识框架、示例题与分类字典（均为预置示例，可在页面内增删改） */
window.SEED = {
  errorCauses: ['概念不清', '审题偏差', '计算失误', '记忆混淆', '思路缺失', '时间不够'],
  kpStatuses: ['未学', '在学', '已掌握', '需巩固'],

  subjects: [
    {
      id: 'zz', name: '考研政治', short: '政治', color: '#d64545', examDate: '',
      sections: [
        { id: 'zz-my', name: '马克思主义基本原理' },

  function parseExamText(text) {

    var lastNum = -1, headType = '';
    function flush() {
      if (!cur) return;

      else if (!cur.answer) { fails.push({ line: cur.lineNo, reason: '缺答案：题干「' + cur.stem.slice(0, 16) + '…」' }); }
      else if (cur.type === 'single' && cur.options.length < 2) {

    }
    /* 判断答案串是否只是选项字母：单选 "A" / 多选 "AC" / 分隔 "A、C" */
    function asOptionLetters(av, hasOpts) {
      if (!hasOpts) return null;

      var mHead = t.match(/^[一二三四五六七八九十]+[、.．]\s*(?:[（(][^)）]{1,10}[)）]\s*)?(单项选择|多项选择|填空|判断|简答|论述|名词解释|翻译|阅读|完形填空|计算|证明|材料分析|问答)(?:题)?\s*$/);

      var mPlain = t.match(/^第\s*(\d{1,3})\s*[题小]\s*(.*)$/) ||

      var mType = t.match(/^(?:【?\s*(?:题型|题目类型)\s*】?\s*[:：])\s*(.*)$/i);
      var mKp = t.match(/^(?:【?\s*(?:知识点|章节|所属章节|大纲|考点)\s*】?\s*[:：])\s*(.*)$/);

        cur.analysis = (cur.analysis ? cur.analysis + '\n' : '') + mAna[1].trim();
      } else if (mType) {

              var parts = splitOptions(cur.stem + ' ' + t);
              if (parts) { cur.stem = parts.stem; cur.options = parts.options; cur.type = 'single'; }
              else cur.options.push({ k: isOpt[1], v: isOpt[2].trim() });
            }
          } else if (isOpt[1].charCodeAt(0) === cur.options[cur.options.length - 1].k.charCodeAt(0) + 1) {
            cur.options.push({ k: isOpt[1], v: isOpt[2].trim() }); cur.type = 'single';
          } else if (cur.answer) {
            cur.analysis = (cur.analysis ? cur.analysis + '\n' : '') + t;
          } else {
            cur.options[cur.options.length - 1].v += ' ' + t;
          }
        } else if (cur.options.length === 0 && !cur.answer) {
          cur.stem += (/[：:？。？]$/.test(cur.stem) ? '' : ' ') + t;
        } else if (cur.answer) {
          /* 答案之后的普通行归入解析（续写），避免污染题干 */
          cur.analysis = (cur.analysis ? cur.analysis + '\n' : '') + t;
        } else {
          cur.options[cur.options.length - 1].v += ' ' + t;
        }
      } else {
        fails.push({ line: i + 1, reason: '无法归入任何一题（该行出现在第一道题号之前）：' + t.slice(0, 22) });
      }
    }
    flush();
    recs.forEach(function (r) { if (r.type !== 'single') r.options = r.options || []; });
    return { recs: recs, fails: fails };
  }

  function parseCsv(text) {
    var rows = [];
    var cell = '', row = [], q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else {
        if (ch === '"') q = true;
        else if (ch === ',') { row.push(cell); cell = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); cell = '';
          if (row.some(function (x) { return x.trim(); })) rows.push(row);
          row = [];
        } else cell += ch;
      }
    }
    row.push(cell);
    if (row.some(function (x) { return x.trim(); })) rows.push(row);
    if (!rows.length) return { recs: [], fails: [{ line: 0, reason: '文件为空' }] };
    var head = rows[0].map(function (h) { return h.trim(); });
    var idx = {};
    var alias = {
      stem: ['题干', '题目', '问题', '内容', 'stem', 'question'],
      options: ['选项', 'options'],
      a: ['选项A', 'A', '选项 A', 'a'],
      b: ['选项B', 'B', '选项 B', 'b'],
      c: ['选项C', 'C', '选项 C', 'c'],
      d: ['选项D', 'D', '选项 D', 'd'],
      answer: ['答案', '正确答案', '参考答案', 'answer'],
      analysis: ['解析', '答案解析', '说明', 'analysis', 'explanation'],
      section: ['章节', '所属章节', '知识点', '大纲'],
      type: ['题型', 'type']
    };
    Object.keys(alias).forEach(function (k) {
      for (var i2 = 0; i2 < head.length; i2++) {
        var h = head[i2].toLowerCase();
        if (alias[k].some(function (x) { return h === x.toLowerCase(); })) { idx[k] = i2; break; }
      }
    });
    var recs = [], fails = [];
    if (idx.stem === undefined) return { recs: [], fails: [{ line: 1, reason: '表头没有「题干」列，现有列：' + head.join(' / ') }] };
    for (var r = 1; r < rows.length; r++) {
      var g = function (k) { return idx[k] === undefined ? '' : (rows[r][idx[k]] || '').trim(); };
      var stem = g('stem');
      var hasAny = rows[r].some(function (x) { return (x || '').trim(); });
      if (!stem) { if (hasAny) fails.push({ line: r + 1, reason: '该行缺少题干内容，已跳过' }); continue; }
      var opts = [];
      ['a', 'b', 'c', 'd', 'e'].forEach(function (k, n) {
        var v = g(k);
        if (v) opts.push({ k: String.fromCharCode(65 + n), v: v });
      });
      if (!opts.length && g('options')) {
        var so = splitOptions(stem + ' ' + g('options'));
        if (so) { stem = so.stem; opts = so.options; }
      }
      var ans = (g('answer') || '').toUpperCase();
      var apick = ans.match(/^([A-H])/);
      var type = /多选|主观|简答|计算|证明|翻译|作文|名词解释|论述/.test(g('type')) ? 'subjective'
        : (apick && opts.length >= 2 ? 'single' : 'subjective');
      if (apick && type === 'single') ans = apick[1];
      if (!ans) { fails.push({ line: r + 1, reason: '缺答案：' + stem.slice(0, 16) + '…' }); continue; }
      recs.push({ stem: stem, options: opts, answer: ans, analysis: g('analysis'), type: type, sectionLabel: g('section'), lineNo: r + 1 });
    }
    return { recs: recs, fails: fails };
  }

  function parseFile(name, text) {
    var n = (name || '').toLowerCase();
    if (n.endsWith('.csv')) return parseCsv(text);
    if (n.endsWith('.md') || n.endsWith('.markdown')) {
      var cleaned = text.replace(/^[ \t]*#{1,6}[ \t]*/gm, '')
        .replace(/^[ \t]*[-*+][ \t]+(?=[A-H](?:[\s]{0,2}[\.、．)）、:：]|[\s]))/gm, '')
        .replace(/^[ \t]*[-*+][ \t]+/gm, ' ')
        .replace(/^[ \t]*[ \t]*>?[ \t]*/gm, '')
        .replace(/^[ \t]*>[ \t]*/gm, '')
        .replace(/\*\*/g, '').replace(/`/g, '');
      var r = parseExamText(cleaned);
      r.isMd = true;
      return r;
    }
    if (n.endsWith('.txt') || n.endsWith('.text') || n === '') {
      var r2 = parseExamText(text);
      if (r2.recs.length >= 2) return r2;
      return parseCsvFallback(name, text, r2);
    }
    var r3 = parseExamText(text);
    if (r3.recs.length) return r3;
    return { recs: [], fails: [{ line: 0, reason: '不支持的格式（请用 txt / md / csv）' }] };
  }
  function parseCsvFallback(name, text, txtResult) {
    if (text.indexOf(',') > -1) {
      var c = parseCsv(text);
      if (c.recs.length >= txtResult.recs.length) return c;
    }
    if (text.indexOf('\t') > -1) {
      var conv = text.split(/\r?\n/).map(function (l) {
        return l.split('\t').map(function (x) { return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',');
      }).join('\n');
      var c2 = parseCsv(conv);
      if (c2.recs.length) return c2;
    }
    return txtResult;
  }

  /* ---------- 章节名 → 章节 id（包含匹配计分） ---------- */
  function matchSection(sub, label) {
    if (!label) return sub.sections.length ? sub.sections[0].id : '';
    var best = null, bestScore = 0;
    var norm = function (s) { return String(s).toLowerCase().replace(/[\s（）()、，,．.]/g, ''); };
    sub.sections.forEach(function (sec) {
      var a = norm(sec.name), b = norm(label);
      var sc = 0;
      if (a === b) sc = 100;
      else if (a.indexOf(b) > -1) sc = 60 + b.length;
      else if (b.indexOf(a) > -1) sc = 50 + a.length;
      else {
        var m = 0;
        for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) > -1) m++;
        sc = m / Math.max(1, a.length) * 30;
      }
      if (sc > bestScore) { bestScore = sc; best = sec; }
    });
    return best ? best.id : sub.sections[0].id;
  }

  /* ---------- 备份 ---------- */
  function exportBackup() {
    var data = JSON.stringify(DB, null, 1);
    var blob = new Blob([data], { type: 'application/json' });
    var a = el('a', { href: URL.createObjectURL(blob), download: '备考工作台备份-' + today() + '.json' });
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 200);
    return a.download;
  }
  function readImported(name, text) {
    try {
      var p = JSON.parse(text);
      if (!p || !Array.isArray(p.subjects)) throw new Error('不是本工作台的备份文件');
      var mode = p.mode || 'merge';
      var inc = p.include || null;
      var fn = p.filename || name;
      if (mode === 'merge') {
        var merged = 0, skipped = 0;
        function absorb(field) {
          var arr = p[field];
          if (!Array.isArray(arr)) return;
          var have = {};
          DB[field].forEach(function (x) { have[x.id] = 1; });
          arr.forEach(function (x) {
            if (!x || !x.id) { skipped++; return; }
            if (inc && inc.indexOf(field) === -1) { return; }
            if (have[x.id]) { skipped++; return; }
            DB[field].push(x); have[x.id] = 1; merged++;
          });
        }
        ['kps', 'questions', 'wrongs', 'logs', 'tasks', 'gym', 'habit', 'refs', 'backups'].forEach(absorb);
        save();
        toast('合并导入完成：新增 ' + merged + ' 条，跳过重复 ' + skipped + ' 条');
      } else {
        DB = Object.assign(blank(), p);
        DB.ui = Object.assign({ tab: 'overview', subject: 'zz', sub: 'kp' }, p.ui || {});
        save();
        toast('已整体恢复，备份来自 ' + fn);
      }
      render();
    } catch (e) {
      toast('导入失败：' + e.message, 'bad');
    }
  }

  /* ---------- 路由 ---------- */
  var TABS = [
    { id: 'overview', name: '总览' },
    { id: 'zz', name: '考研政治' },
    { id: 'e1', name: '英语一' },
    { id: 'm2', name: '数学二' },
    { id: 'dks', name: '地科 880' },
    { id: 'ce', name: '六级/雅思' },
    { id: 'plan', name: '复习计划' },
    { id: 'gym', name: '健身' },
    { id: 'habit', name: '自律打卡' },
    { id: 'library', name: '资料库' },
    { id: 'settings', name: '设置' }
  ];
  var views = {};
  function registerView(id, fn) { views[id] = fn; }

  function go(patch) {
    Object.assign(DB.ui, patch || {});
    save();
    render();
  }
  function renderTabs() {
    var box = document.getElementById('maintabs');
    box.innerHTML = '';
    TABS.forEach(function (t) {
      var on = DB.ui.tab === t.id || (DB.ui.tab.indexOf('sub:') === 0 && DB.ui.tab.slice(4) === t.id);
      box.appendChild(el('button', {
        class: on ? 'on' : '', text: t.name,
        onclick: function () { go({ tab: t.id === 'overview' ? 'overview' : (TABS.slice(1, 6).some(function (x) { return x.id === t.id; }) ? 'sub:' + t.id : t.id) }); }
      }));
    });
  }
  function renderCounts() {
    var box = document.getElementById('countdowns');
    box.innerHTML = '';
    var list = DB.subjects.map(function (s) { return { s: s, d: daysLeft(s.examDate) }; });
    var noDate = list.filter(function (x) { return x.d === null; }).length;
    list.filter(function (x) { return x.d !== null && x.d >= 0; }).sort(function (a, b) { return a.d - b.d; }).slice(0, 4).forEach(function (x) {
      box.appendChild(el('div', { class: 'cd' + (x.d <= 30 ? ' hot' : ''), html: '<b class="num">' + x.d + '</b><span>' + esc(x.s.short) + '天后</span>', title: x.s.name + ' 考试日 ' + x.s.examDate }));
    });
    if (noDate) box.appendChild(el('div', {
      class: 'cd na', html: '<b>—</b><span>' + noDate + ' 科未设日期</span>',
      title: '点击去设置考试日期', style: 'cursor:pointer'
    })).addEventListener('click', function () { go({ tab: 'settings' }); });
    else if (!list.some(function (x) { return x.d !== null; })) {
      box.appendChild(el('div', { class: 'cd na', html: '<b>—</b><span>未设考试日期</span>', style: 'cursor:pointer' }))
        .addEventListener('click', function () { go({ tab: 'settings' }); });
    }
  }
  function render() {
    renderTabs();
    renderCounts();
    var view = document.getElementById('view');
    view.innerHTML = '';
    var id = DB.ui.tab;
    var fn = views[id] || views[id.indexOf('sub:') === 0 ? 'subject' : id];
    if (!fn) { id = 'overview'; fn = views.overview; }
    fn(view);
    var gs = document.getElementById('gsearch');
    gs.value = '';
    document.getElementById('gsuggest').classList.add('hidden');
    if (window.refreshAiChip) window.refreshAiChip();
  }

  /* ---------- 全局搜索 ---------- */
  function searchAll(qy) {
    var q = qy.trim().toLowerCase();
    if (q.length < 1) return [];
    var out = [];
    DB.questions.forEach(function (x) {
      if (x.stem.toLowerCase().indexOf(q) > -1 || (x.analysis || '').toLowerCase().indexOf(q) > -1)
        out.push({ tab: 'sub:' + x.subjectId, sub: 'practice', name: subjectById(x.subjectId).short + ' 题目', text: x.stem.slice(0, 46), ref: x });
    });
    DB.wrongs.forEach(function (x) {
      if (x.stem.toLowerCase().indexOf(q) > -1 || (x.note || '').toLowerCase().indexOf(q) > -1)
        out.push({ tab: 'sub:' + x.subjectId, sub: 'wrong', name: subjectById(x.subjectId).short + ' 错题', text: x.stem.slice(0, 46), ref: x });
    });
    DB.kps.forEach(function (x) {
      if (x.name.toLowerCase().indexOf(q) > -1) out.push({ tab: 'sub:' + x.subjectId, sub: 'kp', name: subjectById(x.subjectId).short + ' 知识点', text: x.name, ref: x });
    });
    DB.tasks.forEach(function (x) {
      if (x.title.toLowerCase().indexOf(q) > -1) out.push({ tab: 'plan', sub: null, name: '任务', text: x.title, ref: x });
    });
    DB.refs.forEach(function (x) {
      if (x.title.toLowerCase().indexOf(q) > -1 || (x.note || '').toLowerCase().indexOf(q) > -1)
        out.push({ tab: 'library', sub: null, name: '文献', text: x.title, ref: x });
    });
    return out.slice(0, 24);
  }
  function bindSearch() {
    var inp = document.getElementById('gsearch'), box = document.getElementById('gsuggest');
    function show() {
      var rs = searchAll(inp.value);
      box.innerHTML = '';
      if (!inp.value.trim() || !rs.length) {
        if (inp.value.trim()) box.appendChild(el('div', { class: 'empty', style: 'padding:14px;border:0', text: '没有匹配项' }));
        else box.classList.add('hidden');
        if (inp.value.trim()) box.classList.remove('hidden');
        return;
      }
      rs.forEach(function (r) {
        box.appendChild(el('button', {
          html: '<span class="tag">' + esc(r.name) + '</span><br>' + esc(r.text),
          onclick: function () {
            DB.ui.tab = r.tab; if (r.sub) DB.ui.sub = r.sub;
            if (r.ref && r.ref.id) DB.ui.focus = r.ref.id;
            save(); box.classList.add('hidden'); render();
          }
        }));
      });
      box.classList.remove('hidden');
    }
    inp.addEventListener('input', show);
    inp.addEventListener('focus', show);
    document.addEventListener('click', function (e) {
      if (!box.contains(e.target) && e.target !== inp) box.classList.add('hidden');
    });
  }

  /* ---------- 暴露 ---------- */
  window.WB = {
    KEY: KEY, MIRROR: MIRROR, SALVAGE: SALVAGE,
    load: load, save: save, get DB() { return DB; }, set DB(v) { DB = v; },
    blankMerge: function (p) { hydrate(p); return DB; },
    storeStatus: storeStatus, hardReset: hardReset, exportSalvage: exportSalvage,
    uid: uid, today: today, esc: esc, el: el, daysLeft: daysLeft,
    subjectById: subjectById, sectionName: sectionName, kpById: kpById, qById: qById, wById: wById,
    toast: toast, modal: modal, confirmBox: confirmBox,
    donut: donut, hbars: hbars, vbars: vbars, stackBar: stackBar,
    subjectStats: subjectStats, streakDays: streakDays, last7: last7, causeCounts: causeCounts,
    parseFile: parseFile, matchSection: matchSection,
    exportBackup: exportBackup, readImported: readImported,
    registerView: registerView, go: go, render: render, bindSearch: bindSearch,
    TABS: TABS
  };
})();

        ]),

        ])
      ]);

        card.appendChild(el('div', { class: 'verdict info hidden', id: 'refbox', html: '<b>参考答案</b>' + esc(q.answer || '（无参考答案）') + (q.analysis ? '\n\n' + esc(q.analysis) : '') }));

        el('button', { class: 'btn small', text: '问 AI 这题', onclick: function () { window.attachAiQuestion(q.stem, q.type === 'single' ? '选项 ' + (q.options.map(function (o) { return o.k; }).join('/')) : '主观题'); } }),
        el('button', { class: 'btn small ghost', text: '重做本题', onclick: function () { delete pState.done[q.id]; W.render(); } }),

      ]));

              d.logs.push({ id: W.uid('lg'), subjectId: sid, date: W.today(), minutes: 0, answered: doneIds.length, right: ok, note: '练习自动记录' });

  function judge(q, given, sid, subjectiveOk) {
    var d = DB(), sub = W.subjectById(sid);
    var ok, label;
    if (q.type === 'single') {
      ok = String(given).toUpperCase() === String(q.answer).toUpperCase();
      label = ok ? '自动判分：选对' : '自动判分：选了 ' + given;
    } else {
      ok = subjectiveOk === true;
      label = ok ? '自评：答对' : '自评：答错';
    }
    pState.done[q.id] = { ok: ok, label: label, myAns: String(given).slice(0, 400) };
    pState.myAns = pState.myAns || {}; pState.myAns[q.id] = String(given).slice(0, 400);

    /* 已存在的关联错题：判对则标记重做通过 */
    var existed = d.wrongs.filter(function (w) { return w.qid === q.id; })[0];
    if (ok) {
      if (existed) existed.reviewed = true;
    } else {
      if (!existed) {
        var causes = q.type === 'single' ? ['概念不清'] : ['思路缺失'];
        var wrec = {
          id: W.uid('w'), qid: q.id, subjectId: sid, sectionId: q.sectionId, kpId: q.kpId || null,
          stem: q.stem, options: (q.options || []).map(function (o) { return o.k + '. ' + o.v; }).join('  '),
          answer: q.answer || '', yourAnswer: String(given).slice(0, 200), analysis: q.analysis || '',
          causes: causes, note: '', date: W.today(), ts: Date.now(), reviewed: false, qtype: q.type, origin: q.origin || ''
        };
        d.wrongs.push(wrec);
        pState.done[q.id].qid = wrec.id;
        if (q.kpId) { var kp = W.kpById(q.kpId); if (kp && kp.status === 2) kp.status = 3; }
      } else {
        existed.reviewed = false;
        existed.yourAnswer = String(given).slice(0, 200);
        pState.done[q.id].qid = existed.id;
      }
    }
    W.save();
    W.render();
    if (!ok) W.toast('判错，已加入错题本：' + sub.short);
  }

  /* ============ 导入真题 ============ */
  function importDialog(sid) {
    var d = DB(), sub = W.subjectById(sid);
    var secSel = el('select', {}, sub.sections.map(function (s) { return el('option', { value: s.id, text: s.name }); }));
    var kpSel = el('select', {}, [el('option', { value: '', text: '按题干自动匹配（默认）' })].concat(
      d.kps.filter(function (k) { return k.subjectId === sid; }).map(function (k) { return el('option', { value: k.id, text: k.name }); })));
    var origin = el('input', { type: 'text', value: '真题导入', placeholder: '来源标注，如 2024 真题' });
    var drop = el('div', { class: 'drop', id: 'dropzone' }, [
      el('b', { text: '把真题文件拖到这里' }),
      el('p', { text: '支持 .txt / .md / .csv（可多选）。csv 需含「题干」列，另有「选项A~D」「答案」「解析」「章节」更好。' })
    ]);
    var picker = el('input', { type: 'file', multiple: 'multiple', accept: '.txt,.md,.markdown,.csv,.text', style: 'width:100%' });
    var rep = el('div', { class: 'report hidden', id: 'rep' });
    var paste = el('textarea', { placeholder: '也可以直接把题目粘贴到这里：\n1. 题干……\nA. 选项\nB. 选项\n答案：A\n解析：……', style: 'min-height:120px' });

    var results = [];
    function handle(files) {
      var pend = files.length;
      if (!pend) return;
      Array.prototype.forEach.call(files, function (f) {
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var txt = fr.result;
            if (/\uFFFD/.test(txt)) { W.toast(f.name + ' 可能是编码非 UTF-8 的文件，建议在记事本另存为 UTF-8 后重试', 'bad'); }
            results.push({ name: f.name, out: W.parseFile(f.name, txt) });
          } catch (e) { results.push({ name: f.name, out: { recs: [], fails: [{ line: 0, reason: e.message }] } }); }
          if (!--pend) paint();
        };
        fr.onerror = function () { results.push({ name: f.name, out: { recs: [], fails: [{ line: 0, reason: '读取失败' }] } }); if (!--pend) paint(); };
        fr.readAsText(f, 'utf-8');
      });
    }
    function paint() {
      if (!results.length) return;
      rep.classList.remove('hidden');
      rep.innerHTML = '';
      var total = 0;
      results.forEach(function (r) {
        var okN = r.out.recs.length, fN = r.out.fails.length;
        total += okN;
        rep.appendChild(el('div', { class: fN && !okN ? 'f' : 's', text: r.name + '：解析成功 ' + okN + ' 题' + (fN ? '，' + fN + ' 条未导入' : '') }));
        r.out.fails.slice(0, 8).forEach(function (x) {
          rep.appendChild(el('div', { class: 'f', text: '  · 第 ' + (x.line || '?') + ' 行 — ' + x.reason }));
        });
        if (fN > 8) rep.appendChild(el('div', { class: 'f', text: '  · 其余 ' + (fN - 8) + ' 条同类问题省略' }));
      });
      rep.appendChild(el('div', { style: 'margin-top:6px;color:var(--ink2)', text: '合计可导入 ' + total + ' 题到「' + sub.name + ' · ' + secSel.options[secSel.selectedIndex].text + '」。确认按钮在下方。' }));
    }

    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) handle(e.dataTransfer.files); });
    drop.addEventListener('click', function () { picker.click(); });
    picker.addEventListener('change', function () { handle(picker.files); });

    function doImport(recs, label) {
      var n = 0, map = {};
      recs.forEach(function (r) {
        var secId;
        if (r.sectionLabel && !map['x' + r.sectionLabel]) {
          secId = W.matchSection(sub, r.sectionLabel);
          map['x' + r.sectionLabel] = secId;
        } else secId = map['x' + r.sectionLabel] || secSel.value;
        var kpId = kpSel.value;
        if (!kpId) {
          var guess = d.kps.filter(function (k) { return k.subjectId === sid && k.sectionId === secId; })[0];
          kpId = guess ? guess.id : null;
        }
        d.questions.push({
          id: W.uid('q'), subjectId: sid, sectionId: secId, kpId: kpId,
          stem: r.stem, options: r.options || [], answer: r.answer, analysis: r.analysis || '',
          type: r.type || 'subjective', origin: label || origin.value.trim() || '真题导入'
        });
        n++;
      });
      W.save();
      return n;
    }

    var m = W.modal({
      title: '导入真题 · ' + sub.name,
      body: [
        el('div', { class: 'form-grid', style: 'margin-bottom:12px' }, [
          el('div', { class: 'field' }, [el('label', { text: '默认归入章节' }), secSel]),

  }
  function setRec(iso, patch) {
    var g = DB().gym, rec = null, i;
    for (i = 0; i < g.length; i++) if (g[i].date === iso) { rec = g[i]; break; }
    if (!rec) { rec = { id: W.uid('g'), date: iso, done: false, minutes: 0 }; g.push(rec); }
    Object.assign(rec, patch);
    if (!rec.done && !rec.minutes && !rec.note) {
      DB().gym = g.filter(function (x) { return x.id !== rec.id; });
    }
    W.save();
  }
  function dowOf(iso) { return (new Date(iso + 'T00:00:00').getDay() + 6) % 7; }
  function expectText(dowIdx) {
    var v = plan()[dowIdx];
    return (v === null || v === undefined || v === '') ? '休息' : String(v);
  }
  function stats() {
    var d = DB(), wd = weekDates();
    var weekDone = 0, weekMin = 0, monthKey = W.today().slice(0, 7), monthDone = 0, streakW = 0;
    wd.forEach(function (iso) {
      var r = recOf(iso);
      if (r && r.done) { weekDone++; weekMin += r.minutes || 0; }
    });
    d.gym.forEach(function (r) { if (r.done && r.date.slice(0, 7) === monthKey) monthDone++; });
    /* 连续达标周：每周完成≥5次算达标，从本周往前数 */
    var weekSet = {};
    d.gym.forEach(function (r) { if (r.done) weekSet[r.date] = 1; });
    function doneInWeek(mondayIso) {
      var n = 0;
      for (var k = 0; k < 7; k++) {
        var dd = new Date(mondayIso + 'T00:00:00'); dd.setDate(dd.getDate() + k);
        var iso = dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0') + '-' + String(dd.getDate()).padStart(2, '0');
        if (weekSet[iso]) n++;
      }
      return n;
    }
    var monday = new Date(); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    for (;;) {
      var mIso = monday.getFullYear() + '-' + String(monday.getMonth() + 1).padStart(2, '0') + '-' + String(monday.getDate()).padStart(2, '0');
      var cnt = doneInWeek(mIso);
      if (cnt >= 5) { streakW++; }
      else if (mIso !== weekDates()[0]) break;
      monday.setDate(monday.getDate() - 7);
      if (streakW > 200) break;
    }
    return { weekDone: weekDone, weekMin: weekMin, monthDone: monthDone, streakW: streakW };
  }

  function editRec(rec) {
    var fMin = el('input', { type: 'number', min: '0', max: '600', value: String(rec.minutes || 0) });
    var fNote = el('input', { type: 'text', value: rec.note || '', placeholder: '今天练了什么、状态如何（可选）' });
    var m = W.modal({
      title: '修改 ' + rec.date + ' 的训练记录',
      body: [
        el('div', { class: 'field' }, [el('label', { text: '时长（分钟）' }), fMin]),
        el('div', { class: 'field', style: 'margin-top:10px' }, [el('label', { text: '备注' }), fNote])
      ],
      footer: [
        el('button', { class: 'btn', text: '取消', onclick: function () { m.close(); } }),
        el('button', { class: 'btn primary', text: '保存', onclick: function () {
          rec.minutes = Math.max(0, Math.min(600, parseInt(fMin.value, 10) || 0));
          rec.note = fNote.value.trim();
          W.save(); m.close(); W.render(); W.toast('记录已更新', 'ok');
        } })
      ]
    });
  }

  function editPlan() {
    var cur = plan().slice();
    var rows = [];
    for (var i = 0; i < 7; i++) {
      rows.push(el('input', { type: 'text', value: cur[i] === null || cur[i] === undefined ? '' : String(cur[i]), placeholder: '留空 = 休息日' }));
    }
    var body = [el('p', { text: '按周一到周日填每天训练部位；某格留空表示那天休息。当前默认：周一胸腹 / 周二背腹 / 周三肩手臂腹 / 周四休息 / 周五胸腹 / 周六背腹 / 周日肩手臂腹。', style: 'margin:0 0 10px;font-size:12px;color:var(--ink3)' })];
    for (var r = 0; r < 7; r++) {
      body.push(el('div', { class: 'field', style: 'display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;margin-bottom:8px' }, [
        el('label', { text: DAY_NAMES[r], style: 'font-size:13px' }), rows[r]]));
    }
    var m = W.modal({
      title: '调整每周训练安排',
      body: body,
      footer: [
        el('button', { class: 'btn', text: '取消', onclick: function () { m.close(); } }),
        el('button', { class: 'btn primary', text: '保存安排', onclick: function () {
          DB().settings.gymPlan = rows.map(function (x) { var v = x.value.trim(); return v || null; });
          W.save(); m.close(); W.render(); W.toast('周计划已更新', 'ok');
        } })
      ]
    });
  }

  function toggle(iso, dowIdx, nowDone) {
    if (nowDone) {
      setRec(iso, { done: false });
      W.toast(DAY_NAMES[dowIdx] + ' 已取消打卡', 'ok');
    } else {
      setRec(iso, { done: true, minutes: 60 });
      W.toast(DAY_NAMES[dowIdx] + ' 打卡完成 ✓（默认 60 分钟，点时长标签可改）', 'ok');
    }
    W.render();
  }

  function dayCard(iso, dowIdx) {
    var rec = recOf(iso);
    var exp = expectText(dowIdx);
    var isToday = iso === W.today();
    var done = !!(rec && rec.done);
    var kids = [
      el('div', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:8px' }, [
        el('button', {
          title: done ? '点击取消打卡' : '点击打卡',
          text: '✓',
          style: 'width:26px;height:26px;border-radius:50%;flex:0 0 auto;font-size:15px;line-height:1;cursor:pointer;' +
            (done ? 'background:var(--ok);border:1.5px solid var(--ok);color:#fff'
                  : 'background:#fff;border:1.5px solid var(--line2);color:transparent'),
          onclick: function () { toggle(iso, dowIdx, done); }
        }),
        el('span', { text: DAY_NAMES[dowIdx] + (isToday ? ' · 今天' : ''), style: 'font-weight:650;font-size:13px' })
      ]),
      el('div', { class: 'rowchips' }, [
        el('span', { class: 'chip' + (exp === '休息' ? '' : ' accent'), text: exp }),
        rec && rec.minutes ? el('span', { class: 'chip ok clickable', text: rec.minutes + ' 分钟', title: '点击修改时长与备注',
          onclick: function () { if (rec) editRec(rec); } }) : null
      ])
    ];
    return el('div', { class: 'card', style: 'padding:12px' + (isToday ? ';outline:2px solid var(--accent)' : '') + (done ? ';background:var(--ok-soft)' : '') }, kids);
  }

  function delRec(id) {
    DB().gym = DB().gym.filter(function (x) { return x.id !== id; });
    W.save();
  }

  function openLog() {
    var fDate = el('input', { type: 'date', value: W.today() });
    var fMin = el('input', { type: 'number', value: '60', min: '0', max: '600' });
    var fNote = el('input', { type: 'text', placeholder: '练了什么、状态如何（可选）' });
    var fDone = el('input', { type: 'checkbox', checked: true, style: 'width:17px;height:17px;accent-color:var(--accent)' });
    var m = W.modal({
      title: '补记一次训练',
      body: [
        el('div', { class: 'field' }, [el('label', { text: '日期' }), fDate]),
        el('div', { class: 'field', style: 'margin-top:10px' }, [el('label', { text: '时长（分钟）' }), fMin]),
        el('div', { class: 'field', style: 'margin-top:10px' }, [el('label', { text: '备注' }), fNote]),
        el('label', { style: 'display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px' }, [fDone, el('span', { text: '标记为已完成打卡' })])
      ],
      footer: [
        el('button', { class: 'btn', text: '取消', onclick: function () { m.close(); } }),
        el('button', { class: 'btn primary', text: '保存', onclick: function () {
          var iso = fDate.value;
          if (!iso) { W.toast('请选择日期', 'bad'); return; }
          setRec(iso, { done: fDone.checked, minutes: Math.max(0, Math.min(600, parseInt(fMin.value, 10) || 0)), note: fNote.value.trim() });
          m.close(); W.render(); W.toast('已保存 ' + iso + ' 的训练记录', 'ok');
        } })
      ]
    });
  }

  function view(v) {
    var d = DB();
    v.appendChild(el('h2', { text: '健身', style: 'margin:0 0 4px' }));
    v.appendChild(el('p', { text: '每周六练 · 周四休息 · 周五至周日循环周一二三的安排（点「调整安排」可改）。点日期旁的圆圈即打卡，再点取消；默认 60 分钟，点时长标签可改并加备注。', style: 'margin:0 0 14px;font-size:12.5px;color:var(--ink3)' }));

    var st = stats();
    v.appendChild(el('div', { class: 'grid g4', style: 'margin-bottom:14px' }, [
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: st.weekDone + '/6' }), el('span', { class: 'lb', text: '本周已完成次数（目标 6）' })]),
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: st.weekMin }), el('span', { class: 'lb', text: '本周训练总时长（分钟）' })]),
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: st.monthDone }), el('span', { class: 'lb', text: '本月已完成次数' })]),
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: st.streakW }), el('span', { class: 'lb', text: '连续达标周数（每周≥5练）' })])
    ]));

    var wd = weekDates();
    var grid = el('div', { class: 'weekgrid' });
    for (var i = 0; i < 7; i++) grid.appendChild(dayCard(wd[i], i));
    v.appendChild(el('div', { class: 'card', style: 'margin-bottom:14px' }, [
      el('h3', { text: '本周' }),
      el('p', { class: 'sub', text: '周一起排，点圆圈打卡；今天的格子有高亮边框。' }),
      grid
    ]));

    v.appendChild(el('div', { class: 'btnrow', style: 'margin-bottom:16px' }, [
      el('button', { class: 'btn', text: '调整每周安排', onclick: editPlan }),
      el('button', { class: 'btn', text: '补记一次训练', onclick: openLog })
    ]));

    v.appendChild(el('h3', { text: '训练记录', style: 'margin:6px 0 8px' }));
    var hs = d.gym.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 60);
    if (!hs.length) {
      v.appendChild(el('div', { class: 'empty', html: '<b>还没有训练记录</b>完成一次训练后，在本周的日期格点圆圈即可。' }));
      return;
    }
    var tb = el('table', { class: 'tbl' });
    tb.appendChild(el('thead', {}, [el('tr', {}, [
      el('th', { text: '日期' }), el('th', { text: '星期' }), el('th', { text: '计划部位' }),
      el('th', { text: '完成' }), el('th', { text: '时长' }), el('th', { text: '备注' }), el('th', {})
    ])]));
    var tbody = el('tbody');
    hs.forEach(function (r) {
      var di = dowOf(r.date);
      tbody.appendChild(el('tr', {}, [
        el('td', { class: 'num', text: r.date }),
        el('td', { text: DAY_NAMES[di] }),
        el('td', { text: expectText(di) }),
        el('td', { html: r.done ? '<span class="chip ok">已打卡</span>' : '<span class="chip">未打卡</span>' }),
        el('td', { class: 'num', text: r.minutes ? r.minutes + ' 分钟' : '—' }),
        el('td', { text: r.note || '—', style: 'max-width:220px' }),
        el('td', { class: 'op' }, [
          el('button', { class: 'linkbtn', text: '编辑', onclick: function () { editRec(r); } }),
          el('button', { class: 'linkbtn', text: '删除', style: 'color:var(--bad)', onclick: function () {
            W.confirmBox('删除记录', '确定删除 ' + r.date + ' 的训练记录？', function () { delRec(r.id); W.render(); });
          } })
        ])
      ]));
    });
    tb.appendChild(tbody);
    v.appendChild(tb);
  }

  W.registerView('gym', view);
})();



</script>
<script>
/* SECTION: habit —— 自律打卡：按月日历点日期打勾/取消，本月天数、连续天数、累计天数统计 */
(function () {
  'use strict';
  var W = window.WB, el = W.el, DB = function () { return W.DB; };

  var cur = null; /* 当前查看月份 {y, m}，null 表示本月 */

  function ymNow() {
    var n = new Date();
    return { y: n.getFullYear(), m: n.getMonth() + 1 };
  }
  function curYM() { return cur || ymNow(); }
  function shift(delta) {
    var ym = curYM();
    var d = new Date(ym.y, ym.m - 1 + delta, 1);
    cur = { y: d.getFullYear(), m: d.getMonth() + 1 };
    W.render();
  }
  function list() {
    var h = DB().habit;
    return Array.isArray(h) ? h : [];
  }
  function setOf() {
    var s = {};
    list().forEach(function (iso) { s[iso] = 1; });
    return s;
  }
  function monthCount(y, m) {
    var k = y + '-' + String(m).padStart(2, '0');
    return list().filter(function (iso) { return iso.slice(0, 7) === k; }).length;
  }
  function streak() {
    var s = setOf(), n = 0;
    var d = new Date();
    if (!s[W.today()]) d.setDate(d.getDate() - 1);
    for (;;) {
      var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (!s[iso]) break;
      n++;
      d.setDate(d.getDate() - 1);
      if (n > 3650) break;
    }
    return n;
  }
  function toggle(iso) {
    var h = DB().habit;
    if (!Array.isArray(h)) { h = []; DB().habit = h; }
    var i = h.indexOf(iso);
    if (i >= 0) { h.splice(i, 1); W.toast('已取消 ' + iso + ' 的打卡'); }
    else { h.push(iso); W.toast('打卡 ' + iso + ' ✓', 'ok'); }
    W.save();
    W.render();
  }

  function calendar(v) {
    var ym = curYM(), s = setOf(), today = W.today();
    var isNow = ym.y === ymNow().y && ym.m === ymNow().m;
    var first = new Date(ym.y, ym.m - 1, 1);
    var pad = (first.getDay() + 6) % 7;
    var n = new Date(ym.y, ym.m, 0).getDate();
    var grid = el('div', { class: 'hgrid' });
    ['一', '二', '三', '四', '五', '六', '日'].forEach(function (h) {
      grid.appendChild(el('div', { class: 'hh', text: h }));
    });
    for (var p = 0; p < pad; p++) grid.appendChild(el('div', { class: 'hp' }));
    for (var day = 1; day <= n; day++) {
      (function (day) {
        var iso = ym.y + '-' + String(ym.m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        var on = !!s[iso];
        grid.appendChild(el('button', {
          class: 'hd' + (on ? ' on' : '') + (iso === today ? ' today' : ''),
          title: iso + (on ? '（已打卡，点击取消）' : '（点击打卡）'),
          onclick: function () { toggle(iso); }
        }, [el('span', { class: 'dn', text: String(day) }), el('span', { class: 'dc', text: on ? '✓' : '' })]));
      })(day);
    }
    var nav = el('div', { class: 'btnrow', style: 'margin-bottom:10px' }, [
      el('button', { class: 'btn small', text: '← 上月', onclick: function () { shift(-1); } }),
      el('span', { class: 'sub', text: ym.y + ' 年 ' + ym.m + ' 月', style: 'align-self:center;font-size:14px;font-weight:650' }),
      el('button', { class: 'btn small', text: isNow ? '本月' : '回到本月', onclick: function () { cur = null; W.render(); } }),
      el('button', { class: 'btn small', text: '下月 →', onclick: function () { shift(1); } })
    ]);
    v.appendChild(el('div', { class: 'card', style: 'margin-bottom:14px' }, [
      el('h3', { text: '点日期打勾' }),
      nav,
      grid,
      el('p', { class: 'sub', text: '一格一次，点击切换；今天的格子有高亮边框。' })
    ]));
  }

  function view(v) {
    var ym = curYM();
    v.appendChild(el('h2', { text: '自律打卡', style: 'margin:0 0 4px' }));
    v.appendChild(el('p', { text: '只记“有没有做到”，按月回看坚持痕迹。', style: 'margin:0 0 14px;font-size:12.5px;color:var(--ink3)' }));

    var st = { month: monthCount(ym.y, ym.m), streak: streak(), total: list().length };
    v.appendChild(el('div', { class: 'grid g3', style: 'margin-bottom:14px' }, [
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: String(st.month) }), el('span', { class: 'lb', text: (ym.m) + ' 月已打卡天数' })]),
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: String(st.streak) }), el('span', { class: 'lb', text: '连续天数（今天未打则从昨天起算）' })]),
      el('div', { class: 'card kpi' }, [el('b', { class: 'num', text: String(st.total) }), el('span', { class: 'lb', text: '累计打卡总天数' })])
    ]));

    calendar(v);

    v.appendChild(el('p', { class: 'sub', text: '数据与其他记录一起存在本机浏览器，导出/导入备份会包含打卡。' }));
  }

  W.registerView('habit', view);
})();

</script>
<script>
/* SECTION: library —— 资料库：知网检索直达 + 文献台账 + 百度网盘备份台账 */
(function () {
  'use strict';
  var W = window.WB, el = W.el, esc = W.esc, DB = function () { return W.DB; };
  var lf = { sub: '', kw: '' };

  /* ---------- 知网检索直达（kns.cnki.net/kns8s/defaultresult/index?kw= 实测可用） ---------- */
  function cnkiSearch(kw) {
    var q = (kw || '').trim();
    var url = q ? 'https://kns.cnki.net/kns8s/defaultresult/index?kw=' + encodeURIComponent(q) : 'https://kns.cnki.net/kns8s/';

  function cnkiBox() {

      W.toast('已在新标签页打开知网检索：' + q);
    }

    return el('div', { class: 'card', style: 'margin-bottom:14px' }, [
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' }, [
        el('h3', { text: '知网检索直达', style: 'margin-right:auto' }),
        el('span', { class: 'chip', text: '跳转官方检索页 · 登录状态由你在浏览器完成' })
      ]),
      el('p', { class: 'sub', style: 'margin:6px 0 10px', text: '输入关键词后回车或点按钮，会在新标签页打开中国知网（kns.cnki.net）检索结果页；把有价值的文献记进下面的台账即可。' }),
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [
        inp, sel,
        el('button', { class: 'btn primary', 'data-primary-action': 'cnki', text: '上知网检索 ↗', onclick: go })
      ])
    ]);
  }

  /* ---------- 文献台账 ---------- */
  function refList() {

    if (lf.kw) {
      var q = lf.kw.toLowerCase();

    }
    list.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });

    var head = el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px' }, [
      el('h3', { text: '文献台账', style: 'flex:1;min-width:120px' }),
      el('span', { class: 'chip accent', text: '共 ' + d.refs.length + ' 篇' + (list.length !== d.refs.length ? ' · 筛出 ' + list.length : '') }),
      el('button', { class: 'btn small primary', 'data-primary-action': 'ref-add', text: '＋ 记一篇文献', onclick: function () { refForm(); } })
    ]);

  /* ---------- 本地导入（电脑文件 → 工作台） ---------- */
  function localImportBox() {
    var d = DB();
    var subjSel = el('select', {}, d.subjects.map(function (s, i) {
      return el('option', { value: s.id, text: s.name, selected: i === 0 ? 'selected' : null });
    }));
    var rep = el('div', { class: 'report hidden' });
    var drop = el('div', { class: 'drop', style: 'margin-top:10px' }, [
      el('b', { text: '把电脑里的文件拖到这里（可多选）' }),
      el('p', { text: '真题 .txt / .md / .csv → 按上面的科目导入题库；备份 .json → 恢复数据（合并或覆盖）。也可点下方按钮直接选文件。' })
    ]);
    var picker = el('input', { type: 'file', multiple: 'multiple', accept: '.txt,.md,.markdown,.csv,.json,.text', style: 'display:none' });

    function paint(lines) {
      rep.innerHTML = '';
      if (!lines.length) { rep.classList.add('hidden'); return; }
      rep.classList.remove('hidden');
      lines.forEach(function (l) { rep.appendChild(el('div', { class: l.cls, text: l.t })); });
    }

    function process(files) {
      if (!files || !files.length) { W.toast('还没有选择文件', 'bad'); return; }
      var js = [], qf = [], other = [];
      Array.prototype.forEach.call(files, function (f) {
        var n = (f.name || '').toLowerCase();
        if (n.endsWith('.json')) js.push(f);
        else if (/\.(txt|md|markdown|csv|text)$/.test(n)) qf.push(f);
        else other.push(f.name);
      });
      var lines = [];
      if (other.length) lines.push({ cls: 'f', t: '不支持的文件已跳过：' + other.join('、') + '（只认 txt / md / csv / json）' });

      var total = 0, failN = 0, pend = qf.slice(), sub = W.subjectById(subjSel.value);
      function nextQ() {
        if (!pend.length) { finishQ(); return; }
        var f = pend.shift();
        var fr = new FileReader();
        fr.onload = function () {
          var txt = String(fr.result || '');
          if (/\uFFFD/.test(txt)) lines.push({ cls: 'f', t: f.name + '：可能是非 UTF-8 编码，若有乱码请在记事本另存为 UTF-8 后重导' });
          var r = W.parseFile(f.name, txt);
          var added = 0;
          r.recs.forEach(function (rec) {
            var secId = rec.sectionLabel ? W.matchSection(sub, rec.sectionLabel) : (sub.sections[0] ? sub.sections[0].id : '');
            d.questions.push({
              id: W.uid('q'), subjectId: sub.id, sectionId: secId, kpId: null,
              stem: rec.stem, options: rec.options || [], answer: rec.answer,
              analysis: rec.analysis || '', type: rec.type || 'subjective', origin: '本地导入·' + f.name
            });
            added++;
          });
          total += added; failN += r.fails.length;
          lines.push({ cls: added ? 's' : 'f', t: f.name + '：成功导入 ' + added + ' 题' + (r.fails.length ? '，' + r.fails.length + ' 条未导入' : '') });
          r.fails.slice(0, 5).forEach(function (x) {
            lines.push({ cls: 'f', t: '  · 第 ' + (x.line || '?') + ' 行 — ' + x.reason });
          });
          if (r.fails.length > 5) lines.push({ cls: 'f', t: '  · 其余 ' + (r.fails.length - 5) + ' 条同类问题省略' });
          nextQ();
        };
        fr.onerror = function () { lines.push({ cls: 'f', t: f.name + '：读取失败' }); nextQ(); };
        fr.readAsText(f, 'utf-8');
      }
      function finishQ() {
        if (total) {
          W.save();
          W.toast('已导入 ' + total + ' 题到「' + sub.name + '」' + (failN ? '（' + failN + ' 条失败见下方）' : ''), failN ? '' : 'ok');
        }
        if (!js.length) { paint(lines); return; }
        if (js.length > 1) lines.push({ cls: 'f', t: '检测到多个 JSON 备份，本次只处理第一个：' + js[0].name });
        var f = js[0];
        var fr = new FileReader();
        fr.onload = function () {
          var p = null;
          try { p = JSON.parse(fr.result); } catch (e) {}
          paint(lines);
          if (!p || !Array.isArray(p.subjects) || !p.subjects.length) {
            W.toast(f.name + ' 不是工作台备份文件，已跳过', 'bad', 4200);
            return;
          }
          askMode(f.name, fr.result, p);
        };
        fr.onerror = function () { lines.push({ cls: 'f', t: f.name + '：读取失败' }); paint(lines); };
        fr.readAsText(f, 'utf-8');
      }
      if (qf.length) nextQ(); else finishQ();
    }

    picker.addEventListener('change', function () { process(picker.files); picker.value = ''; });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) process(e.dataTransfer.files); });
    drop.addEventListener('click', function () { picker.click(); });

    return el('div', { class: 'card', style: 'margin-bottom:14px' }, [
      el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' }, [
        el('h3', { text: '本地导入（电脑文件）', style: 'margin-right:auto' }),

      ]),

  function pickFile(cb) {

<script>
/* SECTION: ai —— 左下角千问提问窗口：配置校验、对话、带入当前题目、答案归档 */
(function () {
  'use strict';
  var W = window.WB, el = W.el, esc = W.esc, DB = function () { return W.DB; };
  var pending = null;   /* 当前带入的题目上下文 */
  var busy = false;

  var SYS = '你是一位陪伴考研/语言学习的备考教练。回答要求：①直接针对问题；②先给结论再给推理；③涉及选择题时逐项说明对错原因；④给出可执行的下一步（该补哪个知识点、怎么防同类错）。控制篇幅，不超过 400 字。';
  var TPLS = [
    '这道题的干扰项是怎么设陷阱的？',
    '把这个知识点讲成人话，并举一个例子',
    '我这类错误反复出现，帮我定一个三步改进法',
    '给我出 3 道同考点的变式题，带答案',
    '把这段答案要点整理成可背诵的口诀'
  ];

  function cfg() { return DB().settings.ai || {}; }
  function ready() { var c = cfg(); return !!(c.baseUrl && c.apiKey && c.model); }

  function refreshChip() {
    var chip = document.getElementById('aimodelchip');
    if (!chip) return;
    var c = cfg();
    if (!ready()) { chip.className = 'chip warn'; chip.textContent = '未配置'; }
    else { chip.className = 'chip ok'; chip.textContent = c.model; }
  }

  function openPanel() {
    document.getElementById('aipanel').classList.remove('hidden');
    paintMsgs();
    var i = document.getElementById('aiinput');
    if (i) setTimeout(function () { i.focus(); }, 60);
  }
  function closePanel() { document.getElementById('aipanel').classList.add('hidden'); }

  function paintCtx() {
    var box = document.getElementById('aictx');
    if (!box) return;
    box.innerHTML = '';
    if (!pending) return;
    box.appendChild(el('div', { class: 'ctxbox' }, [
      el('span', { style: 'flex:1', text: '已带入：' + (pending.tag ? pending.tag + ' · ' : '') + pending.stem.slice(0, 62) + (pending.stem.length > 62 ? '…' : '') }),
      el('span', { class: 'x', text: '✕', title: '移除', onclick: function () { pending = null; paintCtx(); } })
    ]));
  }
  function attachAiQuestion(stem, tag, wrongId) {
    pending = { stem: String(stem || '').slice(0, 1200), tag: tag || '', wrongId: wrongId || null };
    openPanel();
    paintCtx();
    W.toast('已把题目带入提问框');
  }

  function bubble(role, text, extra) {
    var n = el('div', { class: 'msg ' + (role === 'user' ? 'me' : role === 'sys' ? 'sys' : 'bot') });
    if (role === 'bot') n.appendChild(el('span', { class: 'who', text: '千问' }));
    if (role === 'user') n.appendChild(el('span', { class: 'who', text: '我' }));
    n.appendChild(document.createTextNode(text));
    if (extra) n.appendChild(extra);
    return n;
  }
  function paintMsgs() {
    var box = document.getElementById('aimsgs');
    box.innerHTML = '';
    var hist = DB().chat || [];
    if (!hist.length) {
      box.appendChild(bubble('sys', '这个窗口用于把疑问直接发给大模型。第一次使用请先在「设置 → 左下角千问提问窗口 · 服务配置」填接口地址、密钥和模型名。'));
    }
    hist.slice(-40).forEach(function (m) {
      box.appendChild(bubble(m.role === 'user' ? 'user' : m.role === 'sys' ? 'sys' : 'bot', m.text, m.saveable ? saveBar(m) : null));
    });
    box.scrollTop = box.scrollHeight;
  }
  function saveBar(m) {
    var bar = el('div', { class: 'act' });
    bar.appendChild(el('button', { class: 'btn small', text: '存为本题 AI 解析', onclick: function () {
      var d = DB();
      if (m.linkedWrong) {
        var w = W.wById(m.linkedWrong);
        if (w) { w.aiTip = m.text; W.save(); W.render(); W.toast('已写入该错题的 AI 解析', 'ok'); return; }
      }
      if (pending) {
        var sid = d.ui.tab.indexOf('sub:') === 0 ? d.ui.tab.slice(4) : d.subjects[0].id;
        d.wrongs.push({
          id: W.uid('w'), subjectId: sid, sectionId: '', kpId: null,
          stem: pending.stem, answer: '', yourAnswer: '', analysis: '',
          causes: ['思路缺失'], note: '', aiTip: m.text, date: W.today(), ts: Date.now(),
          reviewed: false, qtype: 'subjective', origin: 'AI 归档'
        });
        W.save(); W.render(); W.toast('已连同题目一起存入错题本', 'ok');
      } else W.toast('先带入一道题，或到错题本点「问 AI」', 'bad');
    } }));
    return bar;
  }

  function endpoint() { return cfg().baseUrl.replace(/\/+$/, '') + '/chat/completions'; }

  async function send() {
    if (busy) return;
    var d = DB();
    var inp = document.getElementById('aiinput');
    var text = (inp.value || '').trim();
    if (!text) { W.toast('先写一句你的问题', 'bad'); return; }
    if (!ready()) {
      var box0 = document.getElementById('aimsgs');
      box0.appendChild(bubble('sys', '还没有配置模型服务。打开「设置」页，在「左下角千问提问窗口 · 服务配置」填三项：接口地址、API 密钥、模型名称，保存后回来再发。'));
      box0.appendChild(el('div', { style: 'display:flex;justify-content:center;padding:4px' }, [
        el('button', { class: 'btn small primary', text: '去设置填写', onclick: function () { closePanel(); W.go({ tab: 'settings' }); } })
      ]));
      box0.scrollTop = box0.scrollHeight;
      return;
    }
    var c = cfg();
    var full = pending ? '【题目】' + pending.stem + '\n\n【我的问题】' + text : text;

    d.chat = d.chat || [];
    d.chat.push({ role: 'user', text: full, ts: Date.now() });
    W.save();
    inp.value = '';
    paintMsgs();

    busy = true;
    var sendBtn = document.getElementById('aisend');
    sendBtn.disabled = true; sendBtn.textContent = '思考中…';

    try {
      var body = {
        model: c.model,
        messages: [{ role: 'system', content: SYS }].concat(
          d.chat.slice(-14).map(function (m) { return { role: m.role === 'user' ? 'user' : 'assistant', content: m.text }; })
        ),
        stream: true
      };
      var res = await fetch(endpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.apiKey },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        var et = '';
        try { et = (await res.text()).slice(0, 180); } catch (e) {}
        throw new Error('接口返回 ' + res.status + (et ? '：' + et : ''));
      }
      var box2 = document.getElementById('aimsgs');
      var node = bubble('bot', '…');
      box2.appendChild(node); box2.scrollTop = box2.scrollHeight;
      var txtNode = node.childNodes[node.childNodes.length - 1];
      var acc = '';
      if (res.body && res.body.getReader) {
        var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split('\n'); buf = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var ln = lines[i].trim();
            if (!ln || ln.indexOf('data:') !== 0) continue;
            var payload = ln.slice(5).trim();
            if (payload === '[DONE]') continue;
            try {
              var j = JSON.parse(payload);
              var dl = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (dl) { acc += dl; txtNode.textContent = acc; box2.scrollTop = box2.scrollHeight; }
            } catch (e) {}
          }
        }
      }
      if (!acc) {
        var res2 = await fetch(endpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.apiKey },
          body: JSON.stringify(Object.assign({}, body, { stream: false }))
        });
        var jj = await res2.json();
        acc = (jj.choices && jj.choices[0] && jj.choices[0].message && jj.choices[0].message.content) || '（没有收到内容，可能该模型不支持流式或返回结构不同）';
        txtNode.textContent = acc;
      }
      d.chat.push({
        role: 'assistant', text: acc, ts: Date.now(), saveable: true,
        linkedWrong: pending && pending.wrongId ? pending.wrongId : null
      });
      W.save();
      paintMsgs();
    } catch (e) {
      var mb = document.getElementById('aimsgs');
      mb.appendChild(bubble('sys', '提问失败：' + (e.message || e) + '。常见原因：接口地址少了 /v1、密钥无效、模型名不存在，或服务端不允许浏览器直接跨域调用。'));
      mb.scrollTop = mb.scrollHeight;
    } finally {
      busy = false;
      sendBtn.disabled = false; sendBtn.textContent = '发送提问';
    }
  }

  async function aiTest() {
    var c = cfg();
    if (!ready()) { W.toast('三项都填完才能测试', 'bad'); return; }
    W.toast('正在向接口发一条测试请求…');
    try {
      var res = await fetch(endpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.apiKey },
        body: JSON.stringify({ model: c.model, messages: [{ role: 'user', content: '只回复四个字：连通正常' }], stream: false })
      });
      if (res.ok) W.toast('连通正常：接口可用', 'ok');
      else W.toast('接口返回 ' + res.status + '，请检查地址/密钥/模型名', 'bad');
    } catch (e) {
      W.toast('请求发不出去：' + (e.message || e), 'bad');
    }
  }

  function tplMenu() {
    var box = el('div', { style: 'display:flex;flex-direction:column;gap:6px' });
    TPLS.forEach(function (t) {
      box.appendChild(el('button', { class: 'btn', style: 'text-align:left', text: t, onclick: function () {
        var i = document.getElementById('aiinput');
        i.value = (i.value.trim() ? i.value.trim() + ' ' : '') + t;
        i.focus(); mm.close();
      } }));
    });
    var mm = W.modal({ title: '常用追问（点击填入输入框）', body: [box], footer: [el('button', { class: 'btn', text: '关闭', onclick: function () { mm.close(); } })] });
  }

  /* 练习页当前题暴露给「带入当前题目」 */
  window.currentPracticeQuestion = window.currentPracticeQuestion || null;

  function bind() {
    document.getElementById('dockbtn').addEventListener('click', function () {
      var p = document.getElementById('aipanel');
      if (p.classList.contains('hidden')) openPanel(); else closePanel();
    });
    document.getElementById('aiclose').addEventListener('click', closePanel);
    document.getElementById('aiclr').addEventListener('click', function () {
      W.confirmBox('清空对话记录', '左下角面板的历史问答会被清除（错题本里已存的 AI 解析不受影响）。确定？', function () {
        W.DB.chat = []; W.save(); paintMsgs(); W.toast('已清空', 'ok');
      }, '清空');
    });
    document.getElementById('aisend').addEventListener('click', send);
    document.getElementById('aitpl').addEventListener('click', tplMenu);
    document.getElementById('aiattach').addEventListener('click', function () {
      var d = DB();
      if (d.ui.tab.indexOf('sub:') !== 0) { W.toast('先进入某个科目的练习或错题页，再点带入', 'bad'); return; }
      var sid = d.ui.tab.slice(4);
      if (d.ui.sub === 'wrong') {
        var first = d.wrongs.filter(function (w) { return w.subjectId === sid; })[0];
        if (!first) { W.toast('这一科还没有错题', 'bad'); return; }
        pending = { stem: first.stem + (first.yourAnswer ? '\n我的作答：' + first.yourAnswer : ''), tag: '错题', wrongId: first.id };
      } else {
        var q = typeof window.currentPracticeQuestion === 'function' ? window.currentPracticeQuestion() : null;
        if (!q) {
          var pool = d.questions.filter(function (x) { return x.subjectId === sid; });
          q = pool[0];
        }
        if (!q) { W.toast('这一科还没有题目，先去导入真题', 'bad'); return; }
        pending = {
          stem: q.stem + (q.options && q.options.length ? '\n' + q.options.map(function (o) { return o.k + '. ' + o.v; }).join('\n') : ''),
          tag: W.subjectById(sid).short + ' 题目', qid: q.id
        };
      }
      paintCtx();
      W.toast('已带入当前题目');
    });
    document.getElementById('aiinput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
    });
    paintCtx();
    refreshChip();
  }

  window.attachAiQuestion = attachAiQuestion;
  window.refreshAiChip = refreshChip;
  window.aiTest = aiTest;
  W.bindAi = bind;
})();

</script>
<script>
/* SECTION: boot —— 启动顺序：载入数据 → 绑定搜索与 AI 面板 → 首屏渲染（每步容错，单步异常不拖垮整页） */
(function () {
  'use strict';
  function step(name, fn) {
    try { fn(); } catch (e) {
      if (window.console) console.error('[boot]' + name + ' 异常：', e);
      try { if (window.WB && WB.toast) WB.toast('「' + name + '」加载异常，其余功能仍可用，可刷新重试', 'bad', 4200); } catch (e2) {}
    }
  }
  function start() {
    var W = window.WB;
    if (!W) return;
    step('数据载入', function () { W.load(); });
    step('全局搜索', function () { W.bindSearch(); });
    step('千问窗口', function () {
      if (W.bindAi) W.bindAi();
      window.__dockBound = true;
    });
    step('首屏渲染', function () { W.render(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
